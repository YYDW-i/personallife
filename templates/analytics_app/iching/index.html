{% extends "base.html" %}{% load static %}
{% block title %}易经文化 · LocalLife{% endblock %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/iching.css' %}">
<section class="glass card">
  <div class="iching-intro"><div><div class="eyebrow">CULTURE & REFLECTION</div><h1>易经文化</h1>
  <p class="muted">从一枚硬币开始，读懂卦辞，也留一点时间思考当下。</p></div><div class="iching-mark" aria-hidden="true">☯</div></div>
  <form id="iching-form" class="iching-form" method="post" action="{% url 'analytics_app:iching_cast' %}"
        data-cast-url="{% url 'analytics_app:iching_cast_ajax' %}" data-ai-url="{% url 'analytics_app:iching_interpret' %}">
    {% csrf_token %}
    <label>此刻想思考的问题 <input class="input" name="question" maxlength="1000" placeholder="例如：如何更有耐心地推进一个长期项目？（可不填）"></label>
    <label>起卦方式 <select class="input" name="method"><option value="coins">三币起卦（推荐）</option>
      <option value="random">随机起卦（与三币法同分布）</option></select></label>
    <label class="iching-checkbox muted"><input type="checkbox" name="use_ai" value="1">
      使用智谱 AI 生成白话译文、行动建议和文化背景。问题与卦辞将发送到配置的 AI 服务，需配置 OPENAI_API_KEY。</label>
    <div><button class="btn" type="submit">开始起卦</button> <span class="muted">六爻自下而上 · 原文可离线查看</span></div>
  </form>
  <p id="cast-status" role="status" aria-live="polite"></p>
</section>
<div id="result-container"></div>
<p class="muted">仅供传统文化学习与自我反思，不预测事实，也不替代医疗、法律或财务等专业意见。</p>
<script src="{% static 'js/iching.js' %}" defer></script>
{% endblock %}
